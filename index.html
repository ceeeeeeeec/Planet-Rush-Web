<title>Planet Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050d;color:#e9f7ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}#app{width:100%;height:100%}.shell{position:relative;width:min(100%,900px);height:100%;margin:auto;background:#030812;overflow:hidden}.world{position:absolute;inset:0}.world canvas{display:block;width:100%;height:100%}.topbar{position:absolute;z-index:20;top:0;left:0;right:0;height:74px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#040a14f2,#040a1400);pointer-events:none}.brand{font-size:12px;font-weight:950;letter-spacing:.16em}.brand span{color:#63dcff}.stats{display:flex;gap:7px}.stat{min-width:76px;padding:6px 9px;border:1px solid #284054;border-radius:8px;background:#07111dcc;text-align:center}.stat small{display:block;color:#71889d;font-size:7px;letter-spacing:.14em}.stat b{font-size:13px}.gold{color:#ffd76a}.bottom{position:absolute;z-index:20;left:0;right:0;bottom:0;height:78px;padding:11px;display:flex;gap:8px;background:linear-gradient(#040a1400,#040a14f5 35%)}.nav{flex:1;border:1px solid #263e52;border-radius:10px;background:#091624e8;color:#cfe4f1;font-weight:850;font-size:10px;letter-spacing:.05em;cursor:pointer}.nav.primary{border-color:#4dd7ff;background:#0c3044}.run-info{position:absolute;z-index:15;top:80px;left:50%;transform:translateX(-50%);color:#7e9aae;font-size:8px;letter-spacing:.17em;white-space:nowrap;pointer-events:none}.build{position:absolute;z-index:40;right:10px;top:78px;padding:5px 7px;border:1px solid #263c4e;border-radius:6px;background:#040b13c9;color:#6b8192;font:7px ui-monospace,monospace;letter-spacing:.06em;pointer-events:none}.overlay{position:absolute;z-index:100;inset:7% 5% 9%;display:none;flex-direction:column;border:1px solid #36546a;border-radius:16px;background:linear-gradient(145deg,#0a1827f7,#030912f9);box-shadow:0 20px 80px #000c,0 0 35px #2bc9ff12;backdrop-filter:blur(10px);overflow:hidden}.overlay.open{display:flex}.ov-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #213649}.ov-title{font-size:22px;font-weight:950;letter-spacing:.05em}.ov-sub{margin-top:3px;color:#71899d;font-size:9px;letter-spacing:.1em}.close{width:38px;height:38px;border:1px solid #30495d;border-radius:9px;background:#0c1b2a;color:#bcd2df;cursor:pointer;font-size:20px}.ov-body{flex:1;overflow:auto;padding:16px}.cards{display:grid;gap:10px}.card{padding:14px;border:1px solid #243c50;border-radius:11px;background:#081522}.card-head{display:flex;justify-content:space-between;align-items:center}.card h3{margin:0;font-size:12px}.lv{color:#ffd76a;font-size:9px}.card p{margin:7px 0 12px;color:#7890a4;font-size:10px;line-height:1.45}.buy{width:100%;min-height:40px;border:1px solid #31516a;border-radius:8px;background:#102337;color:#dff6ff;font-weight:850;font-size:10px;cursor:pointer}.buy:disabled{opacity:.4}.tabs{display:flex;gap:7px;margin-bottom:12px}.tab{flex:1;padding:9px;border:1px solid #284154;border-radius:8px;background:#081522;color:#7891a5;font-size:9px;font-weight:850;cursor:pointer}.tab.on{border-color:#4dd7ff;color:#75ddff}.menu{position:absolute;z-index:200;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#123b54 0,#071522 35%,#02050d 78%)}.menu-card{text-align:center;width:min(470px,88%)}.logo{margin:0;font-size:clamp(42px,11vw,74px);font-weight:1000;letter-spacing:.08em}.logo span{color:#5edcff}.tag{margin:9px 0 32px;color:#7590a4;font-size:9px;letter-spacing:.24em}.start{width:100%;height:56px;border:1px solid #55d9ff;border-radius:11px;background:#103a51;color:#effcff;font-weight:950;font-size:16px;cursor:pointer;box-shadow:0 0 35px #3bd5ff1d}.menu-links{display:flex;gap:8px;margin-top:10px}.menu-links button{flex:1;height:46px;border:1px solid #263e52;border-radius:10px;background:#0b1928;color:#b9cdda;font-weight:800;font-size:10px;cursor:pointer}.hint{margin-top:16px;color:#4d6477;font-size:8px;letter-spacing:.1em}@media(max-width:560px){.topbar{height:64px;padding:9px}.stats{gap:4px}.stat{min-width:61px;padding:5px}.stat small{font-size:6px}.stat b{font-size:11px}.bottom{height:70px;padding:8px}.nav{font-size:9px}.overlay{inset:5% 3% 7%}.run-info{top:68px}.build{top:68px}.ov-title{font-size:19px}}
</style>

<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var BUILD="0.5";
var C={w:0,h:0,dpr:1,ctx:null};
var state={
 running:false,planet:1,credits:0,mined:0,depth:0,damage:1,speed:1,magnet:1,basePower:1,prestige:0,
 blocks:[],ship:{x:0,y:0,vx:0,vy:0,a:0,target:null},particles:[],texts:[],shots:[],shake:0,
 overlay:null,lastTime:0,runStarted:false,weapon:"lance"
};
var TYPES={
 normal:{hp:3,value:5,fill:"#304a5e",glow:"#48c9ff"},
 gold:{hp:7,value:28,fill:"#77541a",glow:"#ffd45c"},
 energy:{hp:5,value:16,fill:"#174b5a",glow:"#54f5ff"},
 explosive:{hp:5,value:12,fill:"#652b46",glow:"#ff557f"},
 crystal:{hp:9,value:45,fill:"#4d2d72",glow:"#c07cff"}
};
function esc(s){return String(s).replace(/[&<>"']/g,function(x){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[x]})}
function menu(){
 state.running=false;state.overlay=null;
 app.innerHTML='<div class="shell"><div class="menu"><div class="menu-card"><h1 class="logo">PLANET <span>RUSH</span></h1><div class="tag">AUTONOMOUS DEEP-SPACE MINING</div><button class="start" id="start">START RUN</button><div class="menu-links"><button id="garageMenu">GARAGE</button><button id="baseMenu">BASE</button></div><div class="hint">BUILD '+BUILD+' • CANVAS CORE</div></div></div></div>';
 document.getElementById("start").onclick=startRun;
 document.getElementById("garageMenu").onclick=function(){startRun();openOverlay("garage")};
 document.getElementById("baseMenu").onclick=function(){startRun();openOverlay("base")};
}
function makeBlocks(){
 var a=[],cols=18,rows=34;
 for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
   var edge=Math.abs(x-(cols-1)/2)/((cols-1)/2);
   var limit=0.99-(y/rows)*.10;
   if(edge>limit)continue;
   var r=Math.random(),type=r<.035?"gold":r<.060?"energy":r<.075?"explosive":r<.09?"crystal":"normal";
   var t=TYPES[type];
   a.push({x:x,y:y,type:type,hp:t.hp,max:t.hp,dead:false,hit:0});
 }
 return a;
}
function startRun(){
 state.running=true;state.overlay=null;state.blocks=makeBlocks();state.planet=Math.max(1,state.planet);state.depth=0;
 state.ship={x:C.w*.5,y:C.h*.22,vx:0,vy:30,a:Math.PI/2,target:null};state.particles=[];state.texts=[];state.shots=[];state.lastTime=performance.now();state.runStarted=true;
 renderShell();resize();requestAnimationFrame(loop);
}
function renderShell(){
 app.innerHTML='<div class="shell"><div class="world"><canvas id="game"></canvas></div><div class="topbar"><div class="brand">PLANET <span>RUSH</span></div><div class="stats"><div class="stat"><small>PLANET</small><b id="planet">1</b></div><div class="stat"><small>CREDITS</small><b class="gold" id="credits">0</b></div><div class="stat"><small>MINED</small><b id="mined">0</b></div><div class="stat"><small>DEPTH</small><b id="depth">0m</b></div></div></div><div class="run-info">AUTO MINING • AUTONOMOUS NAVIGATION</div><div class="build">BUILD '+BUILD+' • CANVAS</div><div class="bottom"><button class="nav primary" id="garage">GARAGE</button><button class="nav" id="armory">ARMORY</button><button class="nav" id="stats">STATS</button><button class="nav" id="base">BASE</button></div><div class="overlay" id="overlay"><div class="ov-head"><div><div class="ov-title" id="ovTitle"></div><div class="ov-sub" id="ovSub"></div></div><button class="close" id="close">×</button></div><div class="ov-body" id="ovBody"></div></div></div>';
 document.getElementById("garage").onclick=function(){openOverlay("garage")};
 document.getElementById("armory").onclick=function(){openOverlay("armory")};
 document.getElementById("stats").onclick=function(){openOverlay("stats")};
 document.getElementById("base").onclick=function(){openOverlay("base")};
 document.getElementById("close").onclick=closeOverlay;
 updateHud();
}
function openOverlay(kind){state.overlay=kind;var o=document.getElementById("overlay");if(!o)return;o.classList.add("open");fillOverlay(kind)}
function closeOverlay(){state.overlay=null;var o=document.getElementById("overlay");if(o)o.classList.remove("open")}
function fillOverlay(kind){
 var title="",sub="",body="";
 if(kind==="garage"){
  title="GARAGE";sub="SHIP UPGRADES • GAMEPLAY CONTINUES BEHIND";
  body='<div class="cards">'+upgrade("Drill Power","damage",state.damage,"More damage dealt to every block.",10*state.damage)+upgrade("Mining Speed","speed",state.speed,"Shorter attack cycle and faster target work.",15*state.speed)+upgrade("Resource Core","magnet",state.magnet,"Increases resources from every block.",20*state.magnet)+'</div>';
 }
 if(kind==="armory"){
  title="ARMORY";sub="WEAPON LOADOUT";
  body='<div class="tabs"><button class="tab '+(state.weapon==="lance"?"on":"")+'" data-w="lance">DRILL LANCE</button><button class="tab '+(state.weapon==="pulse"?"on":"")+'" data-w="pulse">PULSE CANNON</button><button class="tab '+(state.weapon==="blast"?"on":"")+'" data-w="blast">BLAST CHARGE</button></div><div class="cards">'+weaponCard("lance","DRILL LANCE","Focused beam that stays locked to one target.",1,420)+weaponCard("pulse","PULSE CANNON","Fast travelling energy bolt with heavier impact.",2,650)+weaponCard("blast","BLAST CHARGE","Explosive shot that damages nearby blocks.",3,900)+'</div>';
 }
 if(kind==="stats"){
  title="COMMAND LOG";sub="CURRENT RUN + PERMANENT PROGRESSION";
  body='<div class="cards"><div class="card"><div class="card-head"><h3>CURRENT RUN</h3><span class="lv">PLANET '+state.planet+'</span></div><p>Blocks mined: <b>'+state.mined+'</b><br>Depth reached: <b>'+Math.floor(state.depth)+'m</b><br>Credits: <b>'+Math.floor(state.credits)+'</b><br>Weapon: <b>'+esc(state.weapon.toUpperCase())+'</b></p></div><div class="card"><div class="card-head"><h3>PERMANENT</h3><span class="lv">PRESTIGE '+state.prestige+'</span></div><p>Base power: <b>'+state.basePower+'</b><br>Permanent resource bonus: <b>'+((1+state.prestige*.01).toFixed(2))+'×</b></p></div><div class="card"><div class="card-head"><h3>SECTOR PROGRESS</h3><span class="lv">ACTIVE</span></div><p>Planet <b>'+state.planet+'</b> is currently being mined. Clear the field to advance.</p></div></div>';
 }
 if(kind==="base"){
  title="BASE";sub="PERMANENT POWER • PRESTIGE";
  body='<div class="cards">'+upgrade("Core Power","basePower",state.basePower,"Raises baseline ship strength.",25*state.basePower) + '<div class="card"><div class="card-head"><h3>PRESTIGE</h3><span class="lv">'+state.prestige+'%</span></div><p>Reset current planet progress and credits in exchange for permanent progression. Unlock condition: reach Planet 5.</p><button class="buy" id="prestige" '+(state.planet<5?"disabled":"")+'>PRESTIGE</button></div></div>';
 }
 var ot=document.getElementById("ovTitle"),os=document.getElementById("ovSub"),ob=document.getElementById("ovBody");
 if(ot){ot.textContent=title;os.textContent=sub;ob.innerHTML=body}
 if(kind==="garage"||kind==="base"){
  ob.querySelectorAll("[data-upgrade]").forEach(function(b){b.onclick=function(){var k=b.dataset.upgrade,c=Number(b.dataset.cost);if(state.credits>=c){state.credits-=c;state[k]++;fillOverlay(kind);updateHud()}}});
 }
 if(kind==="armory"){
  ob.querySelectorAll("[data-w]").forEach(function(b){b.onclick=function(){state.weapon=b.dataset.w;fillOverlay("armory")}})
 }
 var p=document.getElementById("prestige");if(p)p.onclick=function(){if(state.planet>=5){state.prestige++;state.basePower+=2;state.planet=1;state.credits=0;state.blocks=makeBlocks();fillOverlay("base");updateHud()}};
}
function upgrade(name,key,level,desc,cost){
 return '<div class="card"><div class="card-head"><h3>'+name+'</h3><span class="lv">LV '+level+'</span></div><p>'+desc+'</p><button class="buy" data-upgrade="'+key+'" data-cost="'+cost+'" '+(state.credits<cost?"disabled":"")+'>UPGRADE • '+cost+' CREDITS</button></div>';
}
function weaponCard(key,name,desc,dmg,cost){
 return '<div class="card"><div class="card-head"><h3>'+name+'</h3><span class="lv">'+(state.weapon===key?"EQUIPPED":"READY")+'</span></div><p>'+desc+' Base power: '+dmg+'×.</p><button class="buy" data-w="'+key+'">'+(state.weapon===key?"EQUIPPED":"EQUIP")+'</button></div>';
}
function resize(){
 var cv=document.getElementById("game");if(!cv)return;
 var r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);C.w=r.width;C.h=r.height;C.dpr=d;cv.width=Math.floor(C.w*d);cv.height=Math.floor(C.h*d);C.ctx=cv.getContext("2d");C.ctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener("resize",resize);
function planetGeometry(){
 return {cx:C.w/2,cy:C.h*.68,rx:C.w*.44,ry:C.h*.48};
}
function drawBackground(ctx,t){
 ctx.clearRect(0,0,C.w,C.h);
 var g=ctx.createRadialGradient(C.w*.5,C.h*.18,0,C.w*.5,C.h*.45,C.h*.8);g.addColorStop(0,"#102d43");g.addColorStop(.38,"#071522");g.addColorStop(1,"#02050c");ctx.fillStyle=g;ctx.fillRect(0,0,C.w,C.h);
 for(var i=0;i<80;i++){var x=(i*97.31)%C.w,y=(i*47.17)%C.h;var a=.12+.08*Math.sin(t*.0005+i);ctx.fillStyle="rgba(190,235,255,"+a+")";ctx.fillRect(x,y,1+(i%2),1+(i%2))}
 var p=planetGeometry();ctx.save();ctx.beginPath();ctx.ellipse(p.cx,p.cy,p.rx,p.ry,0,Math.PI,Math.PI*2);ctx.fillStyle="#08131f";ctx.fill();ctx.clip();
 var pg=ctx.createLinearGradient(0,p.cy-p.ry,0,p.cy);pg.addColorStop(0,"#24465b");pg.addColorStop(.25,"#142d3f");pg.addColorStop(1,"#08141f");ctx.fillStyle=pg;ctx.fillRect(0,p.cy-p.ry,C.w,p.ry);
 ctx.restore();
 ctx.beginPath();ctx.ellipse(p.cx,p.cy,p.rx,p.ry*.20,0,0,Math.PI*2);ctx.strokeStyle="#5fdcff35";ctx.lineWidth=2;ctx.stroke();
}
function blockPos(b){
 var p=planetGeometry(),cols=18,rows=34;
 var bw=(p.rx*2)/cols*1.02,bh=(p.ry*1.38)/rows;
 var x=p.cx-p.rx+b.x*bw+bw*.5;
 var y=p.cy-p.ry*.92+b.y*bh+bh*.5;
 var surface=((y-p.cy)/p.ry);var width=Math.max(0.12,Math.sqrt(Math.max(.02,1-surface*surface)));
 return {x:x,y:y,w:bw*.92*width,h:bh*.88};
}
function drawBlock(ctx,b){
 var q=blockPos(b);if(q.y>C.h*.92)return;
 var t=TYPES[b.type],hp=Math.max(0,b.hp/b.max),hit=b.hit;
 ctx.save();ctx.translate(q.x,q.y);
 ctx.globalAlpha=.35+hp*.65;
 var glow=t.glow;ctx.shadowColor=glow;ctx.shadowBlur=hit>0?16:5;
 ctx.fillStyle=t.fill;ctx.strokeStyle=glow;ctx.lineWidth=hit>0?2:1;
 var w=q.w*.94,h=q.h*.9;
 ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,2);ctx.fill();ctx.stroke();
 ctx.shadowBlur=0;ctx.fillStyle="rgba(255,255,255,.18)";ctx.beginPath();ctx.moveTo(-w/2+2,-h/2+2);ctx.lineTo(w/2-2,-h/2+2);ctx.lineTo(w/2-4,-h/2+5);ctx.lineTo(-w/2+2,-h/2+5);ctx.fill();
 if(hp<.99){ctx.fillStyle=t.glow;ctx.globalAlpha=.8;ctx.fillRect(-w/2,-h/2-3,w*hp,2)}
 if(b.type==="explosive"){ctx.strokeStyle="#ff9bb4";ctx.globalAlpha=.8;ctx.beginPath();ctx.moveTo(-3,-3);ctx.lineTo(3,3);ctx.moveTo(3,-3);ctx.lineTo(-3,3);ctx.stroke()}
 ctx.restore();
}
function chooseTarget(){
 var s=state.ship,best=null,score=1e9;
 for(var i=0;i<state.blocks.length;i++){var b=state.blocks[i];if(b.dead)continue;var q=blockPos(b),dx=q.x-s.x,dy=q.y-s.y;var dist=Math.hypot(dx,dy);var score2=dist+(q.y<C.h*.34?160:0);if(dist<score){score=dist;best=i}}
 return best;
}
function addBurst(x,y,color,n,power){
 for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=(20+Math.random()*90)*(power||1);state.particles.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1+Math.random()*2,life:.35+Math.random()*.55,max:.8,color:color})}
}
function addText(x,y,text,color){state.texts.push({x:x,y:y,text:text,color:color,life:.75})}
function attack(now){
 var s=state.ship;if(s.target==null||!state.blocks[s.target]||state.blocks[s.target].dead)s.target=chooseTarget();
 var b=state.blocks[s.target];if(!b)return;
 var q=blockPos(b),dx=q.x-s.x,dy=q.y-s.y,d=Math.hypot(dx,dy);
 if(d>Math.max(42,q.w*2.2))return;
 var mult=state.weapon==="pulse"?1.7:state.weapon==="blast"?1.25:1;
 var dmg=(state.damage+state.basePower-1)*mult;
 b.hp-=dmg;b.hit=.12;
 var t=TYPES[b.type];state.shots.push({x:s.x,y:s.y,tx:q.x,ty:q.y,life:.16,type:state.weapon,color:t.glow});
 addBurst(q.x,q.y,t.glow,state.weapon==="blast"?10:5,state.weapon==="blast"?1.3:1);
 state.shake=Math.min(5,state.shake+1.2);
 if(b.hp<=0){
  b.dead=true;var gain=Math.floor(t.value*state.magnet*(1+state.prestige*.01));state.credits+=gain;state.mined++;state.depth=Math.max(state.depth,q.y/C.h*120);
  addText(q.x,q.y,"+"+gain,t.glow);
  addBurst(q.x,q.y,t.glow,18,1.4);
  if(b.type==="explosive")chainExplode(b);
  s.target=null;
  if(state.mined%18===0&&state.blocks.filter(function(z){return !z.dead}).length<30)nextPlanet();
 }
}
function chainExplode(origin){
 var oq=blockPos(origin);
 state.blocks.forEach(function(b){if(b.dead)return;var q=blockPos(b),d=Math.hypot(q.x-oq.x,q.y-oq.y);if(d<55){b.hp-=3;b.hit=.18;addBurst(q.x,q.y,"#ff557f",7,1.1);if(b.hp<=0){b.dead=true;state.credits+=Math.floor(TYPES[b.type].value*.5);state.mined++;addText(q.x,q.y,"CHAIN","#ff7797")}}});
 addBurst(oq.x,oq.y,"#ff557f",30,2);state.shake=8;
}
function nextPlanet(){state.planet++;state.blocks=makeBlocks();state.ship.x=C.w*.5;state.ship.y=C.h*.18;state.depth=0;addText(C.w*.5,C.h*.35,"PLANET "+state.planet,"#64dcff");updateHud()}
function updateHud(){
 var set=function(id,v){var e=document.getElementById(id);if(e)e.textContent=v};
 set("planet",state.planet);set("credits",Math.floor(state.credits).toLocaleString());set("mined",state.mined);set("depth",Math.floor(state.depth)+"m");
}
function update(dt,now){
 if(!state.running)return;
 var s=state.ship;
 var live=state.blocks.filter(function(b){return !b.dead});
 if(!live.length){nextPlanet();return}
 if(s.target==null||!state.blocks[s.target]||state.blocks[s.target].dead)s.target=chooseTarget();
 var b=state.blocks[s.target],q=b?blockPos(b):{x:C.w*.5,y:C.h*.5};
 var dx=q.x-s.x,dy=q.y-s.y,d=Math.hypot(dx,dy)||1;
 var desiredX=dx/d,desiredY=dy/d;
 var orbitX=-desiredY,orbitY=desiredX;
 var near=d<100?1:0;
 var accel=90+state.speed*18;
 s.vx+=(desiredX*accel+orbitX*near*48)*dt;s.vy+=(desiredY*accel+orbitY*near*48)*dt;
 var max=115+state.speed*30;var v=Math.hypot(s.vx,s.vy);if(v>max){s.vx=s.vx/v*max;s.vy=s.vy/v*max}
 s.vx*=Math.pow(.90,dt*60);s.vy*=Math.pow(.90,dt*60);s.x+=s.vx*dt;s.y+=s.vy*dt;
 var p=planetGeometry();var minY=C.h*.12,maxY=p.cy+p.ry*.08;s.x=Math.max(C.w*.12,Math.min(C.w*.88,s.x));s.y=Math.max(minY,Math.min(maxY,s.y));
 if(Math.hypot(s.vx,s.vy)>2)s.a=Math.atan2(s.vy,s.vx);
 if(now-(state.lastAttack||0)>Math.max(230,520/state.speed)){state.lastAttack=now;attack(now)}
 state.blocks.forEach(function(z){if(z.hit>0)z.hit-=dt});
 state.particles.forEach(function(x){x.x+=x.vx*dt;x.y+=x.vy*dt;x.vx*=.94;x.vy*=.94;x.life-=dt});
 state.particles=state.particles.filter(function(x){return x.life>0});
 state.texts.forEach(function(x){x.y-=28*dt;x.life-=dt});state.texts=state.texts.filter(function(x){return x.life>0});
 state.shots.forEach(function(x){x.life-=dt});state.shots=state.shots.filter(function(x){return x.life>0});
 state.shake*=Math.pow(.08,dt);
 updateHud();
}
function drawShip(ctx){
 var s=state.ship;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);
 ctx.shadowColor="#5edcff";ctx.shadowBlur=20;
 ctx.fillStyle="#bfefff";ctx.strokeStyle="#eaffff";ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-12,-10);ctx.lineTo(-7,0);ctx.lineTo(-12,10);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.shadowBlur=0;ctx.fillStyle="#317a98";ctx.beginPath();ctx.moveTo(-4,-7);ctx.lineTo(-15,-14);ctx.lineTo(-10,-2);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(-4,7);ctx.lineTo(-15,14);ctx.lineTo(-10,2);ctx.closePath();ctx.fill();
 ctx.fillStyle="#fff";ctx.shadowColor="#7df0ff";ctx.shadowBlur=12;ctx.beginPath();ctx.arc(7,0,4,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#49d8ff";ctx.globalAlpha=.75;ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(-25,-4-Math.random()*4);ctx.lineTo(-25,4+Math.random()*4);ctx.closePath();ctx.fill();ctx.restore();
}
function draw(ctx,t){
 var sx=state.shake?((Math.random()-.5)*state.shake):0,sy=state.shake?((Math.random()-.5)*state.shake):0;ctx.save();ctx.translate(sx,sy);
 drawBackground(ctx,t);
 state.blocks.forEach(function(b){if(!b.dead)drawBlock(ctx,b)});
 var s=state.ship,b=state.blocks[s.target],q=b&&!b.dead?blockPos(b):null;
 if(q){var d=Math.hypot(q.x-s.x,q.y-s.y);if(d<220){ctx.save();ctx.globalAlpha=Math.max(0,(220-d)/220)*.7;ctx.strokeStyle=TYPES[b.type].glow;ctx.shadowColor=TYPES[b.type].glow;ctx.shadowBlur=10;ctx.lineWidth=2;ctx.setLineDash([7,7]);ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(q.x,q.y);ctx.stroke();ctx.restore()}}
 state.shots.forEach(function(x){ctx.save();ctx.globalAlpha=Math.max(0,x.life/.16);ctx.strokeStyle=x.color;ctx.shadowColor=x.color;ctx.shadowBlur=15;ctx.lineWidth=state.weapon==="lance"?3:5;ctx.beginPath();ctx.moveTo(x.x,x.y);ctx.lineTo(x.tx,x.ty);ctx.stroke();ctx.restore()});
 state.particles.forEach(function(x){ctx.save();ctx.globalAlpha=Math.max(0,x.life/x.max);ctx.fillStyle=x.color;ctx.shadowColor=x.color;ctx.shadowBlur=8;ctx.fillRect(x.x-x.r,x.y-x.r,x.r*2,x.r*2);ctx.restore()});
 drawShip(ctx);
 state.texts.forEach(function(x){ctx.save();ctx.globalAlpha=Math.max(0,x.life/.75);ctx.fillStyle=x.color;ctx.font="900 11px system-ui";ctx.textAlign="center";ctx.shadowColor=x.color;ctx.shadowBlur=8;ctx.fillText(x.text,x.x,x.y);ctx.restore()});
 ctx.restore();
}
function loop(now){
 if(!state.running)return;
 var dt=Math.min(.033,(now-state.lastTime)/1000||.016);state.lastTime=now;update(dt,now);draw(C.ctx,now);
 requestAnimationFrame(loop);
}
function boot(){menu()}
boot();
})();
</script>
