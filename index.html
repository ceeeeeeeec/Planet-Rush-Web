<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050914">
<title>Planet Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050914;color:#eef6ff;font-family:Inter,system-ui,-apple-system,sans-serif}body{overflow:hidden}
#app{width:100%;height:100%}.screen{width:min(100%,760px);height:100%;margin:auto;display:flex;flex-direction:column;background:#07101d}
.menu{height:100%;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 28%,#183552 0,#0a1727 38%,#050914 78%)}.menu-card{text-align:center;width:min(440px,100%)}.logo{font-size:clamp(38px,9vw,64px);font-weight:900;letter-spacing:.06em;margin:0}.subtitle{color:#8297ae;margin:8px 0 34px;letter-spacing:.18em;font-size:11px}.play{width:100%;height:58px;border:1px solid #55cfff;border-radius:12px;background:#12324a;color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 0 28px #2bc4ff20}.version{margin-top:18px;color:#52677e;font-size:11px}
.top{height:70px;display:flex;align-items:center;justify-content:space-around;border-bottom:1px solid #1c2b3c;background:#0a1523;flex-shrink:0}.stat{text-align:center;min-width:90px}.stat span{display:block;font-size:9px;letter-spacing:.15em;color:#687d93;margin-bottom:4px}.stat b{font-size:17px}.gold{color:#ffd166}
.field{position:relative;flex:1;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 5%,#18334d 0,#091524 35%,#030711 82%)}.stars{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:73px 71px;opacity:.11}
.planet{position:absolute;left:8%;right:8%;top:7%;bottom:0;border-radius:44px 44px 0 0;overflow:hidden;background:linear-gradient(#182b3c,#0d1825);border:1px solid #263c51}.blocks{position:absolute;inset:0}.block{position:absolute;border-radius:4px;background:linear-gradient(145deg,#697d91,#354659);box-shadow:inset 0 1px #ffffff20,0 1px 2px #0008;transition:opacity .12s,transform .12s}.block.special{background:linear-gradient(145deg,#ffe08a,#c58a17);box-shadow:0 0 12px #ffd16635}.block.hit{transform:scale(.82);opacity:.2}
.drill{position:absolute;z-index:5;width:66px;height:66px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #dffaff;background:radial-gradient(circle,#f6ffff 0 15%,#72ddff 16% 34%,#147697 35% 57%,#081a27 58%);box-shadow:0 0 24px #52d7ff88;pointer-events:none}.drill:after{content:"";position:absolute;left:50%;top:100%;width:3px;height:90px;transform:translateX(-50%);background:linear-gradient(#54d7ff99,transparent)}
.message{position:absolute;left:0;right:0;top:18px;text-align:center;color:#91a6bb;font-size:10px;letter-spacing:.16em;pointer-events:none}.controls{height:76px;display:flex;gap:10px;padding:12px;background:#0a1523;border-top:1px solid #1c2b3c;flex-shrink:0}.controls button{flex:1;border:1px solid #2a4055;border-radius:10px;background:#122236;color:#eaf5ff;font-weight:800;cursor:pointer}.controls button.on{border-color:#4dd4ff;color:#70ddff}
@media(max-width:520px){.top{height:62px}.planet{left:3%;right:3%}.controls{height:68px;padding:9px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var state={screen:"menu",credits:0,mined:0,auto:true,x:.5,y:.15,blocks:[],last:0};
var COLS=10,ROWS=19;
function makeBlocks(){
 var a=[];
 for(var y=1;y<ROWS;y++) for(var x=0;x<COLS;x++) if(Math.random()>.07)
   a.push({x:x,y:y,special:Math.random()<.06});
 return a;
}
function menu(){
 app.innerHTML='<div class="screen menu"><div class="menu-card"><h1 class="logo">PLANET RUSH</h1><div class="subtitle">AUTONOMOUS PLANET MINING</div><button class="play" id="play">PLAY</button><div class="version">WEB PROTOTYPE</div></div></div>';
 document.getElementById("play").onclick=function(){state.screen="game";state.blocks=makeBlocks();render();};
}
function render(){
 if(state.screen==="menu"){menu();return;}
 app.innerHTML='<div class="screen"><header class="top"><div class="stat"><span>PLANET</span><b>01</b></div><div class="stat"><span>CREDITS</span><b class="gold">'+state.credits.toLocaleString()+'</b></div><div class="stat"><span>MINED</span><b>'+state.mined+'</b></div></header><main class="field" id="field"><div class="stars"></div><div class="planet"><div class="blocks">'+state.blocks.map(function(b){return '<div class="block '+(b.special?"special":"")+'" style="left:'+(b.x/COLS*100)+'%;top:'+(b.y/ROWS*100)+'%;width:'+(100/COLS-.7)+'%;height:'+(100/ROWS-.7)+'%"></div>';}).join("")+'</div></div><div class="drill" id="drill"></div><div class="message">DRAG TO STEER • AUTO MINING '+(state.auto?"ON":"OFF")+'</div></main><footer class="controls"><button id="auto" class="'+(state.auto?"on":"")+'">AUTO MINING</button><button id="new">NEW PLANET</button><button id="menu">MENU</button></footer></div>';
 var field=document.getElementById("field"),drill=document.getElementById("drill");
 function place(){drill.style.left=(state.x*100)+"%";drill.style.top=(8+state.y*88)+"%";}
 place();
 var dragging=false;
 field.onpointerdown=function(e){dragging=true;field.setPointerCapture&&field.setPointerCapture(e.pointerId);move(e)};
 field.onpointermove=move;
 field.onpointerup=field.onpointercancel=function(){dragging=false};
 function move(e){if(!dragging)return;var r=field.getBoundingClientRect();state.x=Math.max(.08,Math.min(.92,(e.clientX-r.left)/r.width));state.y=Math.max(.03,Math.min(.88,(e.clientY-r.top)/r.height));place();}
 document.getElementById("auto").onclick=function(){state.auto=!state.auto;render()};
 document.getElementById("new").onclick=function(){state.blocks=makeBlocks();render()};
 document.getElementById("menu").onclick=function(){state.screen="menu";render()};
}
function mine(){
 if(state.screen!=="game"||!state.auto||!state.blocks.length)return;
 var best=-1,score=Infinity;
 for(var i=0;i<state.blocks.length;i++){
   var b=state.blocks[i],bx=(b.x+.5)/COLS,by=(b.y+.5)/ROWS;
   var s=Math.abs(bx-state.x)+Math.abs(by-state.y)*.55;
   if(s<score){score=s;best=i;}
 }
 if(best<0)return;
 var b=state.blocks.splice(best,1)[0];
 state.credits+=b.special?25:5;state.mined++;
 render();
 if(!state.blocks.length){setTimeout(function(){if(state.screen==="game"){state.blocks=makeBlocks();render();}},900);}
}
menu();
setInterval(function(){if(state.auto&&Date.now()-state.last>650){state.last=Date.now();mine();}},100);
})();
</script>
</body>
</html>
