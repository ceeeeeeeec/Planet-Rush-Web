<head>

<title>Planet Rush</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#030711;color:#edf6ff;font-family:Inter,system-ui,-apple-system,sans-serif}body{overflow:hidden}
#app{width:100%;height:100%}.screen{width:min(100%,820px);height:100%;margin:auto;display:flex;flex-direction:column;background:#07101d}
.menu{height:100%;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 27%,#1a3a55 0,#0b1929 38%,#030711 82%)}.menu-card{width:min(470px,100%);text-align:center}.logo{font-size:clamp(42px,10vw,72px);font-weight:950;letter-spacing:.07em;margin:0}.logo span{color:#65d9ff}.subtitle{color:#8095ab;margin:10px 0 38px;letter-spacing:.22em;font-size:10px}.menu-actions{display:grid;gap:10px}.play,.menu-btn,.upgrade-btn{min-height:54px;border-radius:11px;border:1px solid #2d465d;background:#112236;color:#eef7ff;font-weight:850;cursor:pointer}.play{background:#123952;border-color:#58d5ff;box-shadow:0 0 25px #38c8ff20;font-size:17px}.menu-btn:disabled{opacity:.45;cursor:default}.version{margin-top:18px;color:#52677e;font-size:10px;letter-spacing:.1em}
.top{height:70px;display:flex;align-items:center;justify-content:space-around;border-bottom:1px solid #1b2b3c;background:#091521;flex-shrink:0}.stat{text-align:center;min-width:80px}.stat span{display:block;font-size:9px;letter-spacing:.15em;color:#687d93;margin-bottom:4px}.stat b{font-size:17px}.gold{color:#ffd166}.top .planet-name{color:#8fa5ba;font-size:10px}
.field{position:relative;flex:1;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 7%,#17334c 0,#091524 34%,#020610 84%)}.stars{position:absolute;inset:0;background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:71px 69px;opacity:.13}.planet{position:absolute;left:6%;right:6%;top:8%;bottom:-4%;border-radius:50% 50% 0 0/18% 18% 0 0;background:linear-gradient(180deg,#26394a,#172636 48%,#0c1723);border:1px solid #334b60;box-shadow:0 -10px 45px #24465a22}.planet:before{content:"";position:absolute;left:5%;right:5%;top:3%;height:10px;border-radius:50%;background:#39566b66}.blocks{position:absolute;inset:5% 3% 0;overflow:hidden}.block{position:absolute;border-radius:5px;background:linear-gradient(145deg,#7c8fa1,#394b5d);box-shadow:inset 0 1px #ffffff22,0 2px 3px #0008;transition:opacity .15s,transform .15s}.block.special{background:linear-gradient(145deg,#ffe89d,#c68a19);box-shadow:0 0 14px #ffd16644}.block.rare{background:linear-gradient(145deg,#a78bfa,#6040a1);box-shadow:0 0 14px #9b7cff44}.block.hit{transform:scale(.65);opacity:0}
.ship{position:absolute;z-index:8;width:76px;height:50px;transform:translate(-50%,-50%);pointer-events:none;transition:left .13s linear,top .13s linear}.ship-body{position:absolute;left:8px;right:8px;top:8px;height:34px;border-radius:50% 50% 40% 40%;background:linear-gradient(#dffaff,#5fb7d2 48%,#17495f);border:2px solid #dffaff;box-shadow:0 0 20px #4bd6ff77}.ship-core{position:absolute;left:29px;top:16px;width:18px;height:18px;border-radius:50%;background:#f7ffff;box-shadow:0 0 10px #fff}.ship-fin{position:absolute;bottom:1px;width:16px;height:15px;background:#174154;border:1px solid #63bfd9}.ship-fin.left{left:8px;transform:skewY(25deg)}.ship-fin.right{right:8px;transform:skewY(-25deg)}.beam{position:absolute;z-index:7;width:3px;transform-origin:top center;background:linear-gradient(#bdf5ff,#42caff00);pointer-events:none;opacity:0}.beam.active{opacity:1}.projectile{position:absolute;z-index:12;width:10px;height:10px;border-radius:50%;background:#9ff3ff;box-shadow:0 0 14px #54dfff;pointer-events:none}.blast-ring{position:absolute;z-index:11;width:28px;height:28px;border:3px solid #ffd166;border-radius:50%;pointer-events:none;animation:blast .42s ease-out forwards}.blast-hit{transform:scale(.55)!important;opacity:.25!important}.beam.active{opacity:1}.burst{position:absolute;z-index:9;width:34px;height:34px;border-radius:50%;border:2px solid #dffaff;pointer-events:none;animation:burst .28s ease-out forwards}.debris{position:absolute;z-index:9;width:5px;height:5px;border-radius:1px;background:#d9f8ff;pointer-events:none;animation:debris .42s ease-out forwards}@keyframes debris{to{transform:translate(var(--dx),var(--dy)) rotate(180deg);opacity:0}}@keyframes burst{to{transform:scale(2.4);opacity:0}}@keyframes blast{to{transform:scale(3.8);opacity:0}}
.build-overlay{position:absolute;z-index:30;right:10px;top:10px;padding:6px 9px;border:1px solid #294052;border-radius:7px;background:#06101bcc;color:#6f879b;font:8px ui-monospace,SFMono-Regular,monospace;letter-spacing:.05em;pointer-events:none}.hud{position:absolute;z-index:10;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;pointer-events:none}.pill{padding:7px 10px;border:1px solid #30465a;border-radius:8px;background:#07111dcc;color:#9eb2c5;font-size:9px;letter-spacing:.08em}.message{position:absolute;left:0;right:0;top:15px;text-align:center;color:#8398ac;font-size:9px;letter-spacing:.16em;pointer-events:none}
.controls{height:68px;display:flex;gap:7px;padding:8px;background:#091521;border-top:1px solid #1b2b3c;flex-shrink:0}.controls button{flex:1;min-width:0;border:1px solid #294055;border-radius:9px;background:#0d1d2d;color:#eaf4ff;font-weight:800;font-size:10px;cursor:pointer}.controls button.active{border-color:#58d5ff;color:#6bdcff}.controls button.primary{border-color:#58d5ff;background:#12364d}
.overlay{position:absolute;z-index:40;inset:0;background:#020812b8;backdrop-filter:blur(5px);display:flex;align-items:flex-end}.overlay-card{width:100%;max-height:82%;overflow:auto;background:#081522;border-top:1px solid #315069;border-radius:18px 18px 0 0;padding:18px}.overlay-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.overlay-head h2{margin:0;font-size:20px}.close{border:1px solid #294055;background:#0d1d2d;color:#dcecff;border-radius:8px;padding:8px 11px;font-weight:800}.weapon-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.weapon-card{padding:11px;border:1px solid #294055;border-radius:10px;background:#0b1b2a}.weapon-card.active{border-color:#58d5ff;background:#102a3b}.weapon-card b{display:block;font-size:11px}.weapon-card span{display:block;color:#7890a5;font-size:9px;line-height:1.35;margin-top:6px}.weapon-card button{width:100%;margin-top:9px;min-height:34px;border:1px solid #35546c;border-radius:7px;background:#122638;color:#eaf6ff;font-weight:800;font-size:9px}@media(max-width:520px){.weapon-grid{grid-template-columns:1fr}}.boot{position:fixed;z-index:100;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 30%,#173b55 0,#071321 42%,#02050b 100%);transition:opacity .45s ease}.boot.fade{opacity:0;pointer-events:none}.boot-card{width:min(520px,100%);text-align:center;padding:28px 22px;border:1px solid #315069;border-radius:16px;background:#06101ddd;box-shadow:0 20px 70px #0009}.boot-logo{font-size:clamp(34px,9vw,58px);font-weight:950;letter-spacing:.08em;margin:0}.boot-logo span{color:#65d9ff}.boot-kicker{margin:8px 0 28px;color:#718ba2;font-size:9px;letter-spacing:.24em}.boot-status{min-height:18px;color:#a9c0d3;font:10px ui-monospace,SFMono-Regular,monospace;letter-spacing:.12em}.boot-track{height:10px;margin:12px 0 8px;border:1px solid #29485d;border-radius:5px;background:#07111c;overflow:hidden}.boot-fill{height:100%;width:0;background:linear-gradient(90deg,#267fa8,#65d9ff);box-shadow:0 0 18px #48d8ff88;transition:width .12s linear}.boot-percent{color:#65d9ff;font:11px ui-monospace,SFMono-Regular,monospace}.boot.intro .boot-status{color:#65d9ff;font-weight:800}.boot.intro .boot-kicker{margin-bottom:20px}.boot.intro .boot-percent{display:none}
.panel{height:100%;overflow:auto;padding:22px;background:radial-gradient(circle at 50% 15%,#17324a 0,#081321 42%,#030711 90%)}.panel-inner{width:min(650px,100%);margin:auto}.back{border:0;background:none;color:#83a0b8;cursor:pointer;font-weight:700;padding:8px 0}.panel h2{font-size:30px;margin:10px 0 4px}.panel-sub{color:#7890a5;font-size:12px;margin-bottom:22px}.upgrade-list{display:grid;gap:10px}.upgrade{padding:15px;border:1px solid #263b50;border-radius:12px;background:#0b1826}.upgrade-head{display:flex;justify-content:space-between;gap:10px}.upgrade-name{font-weight:850}.level{color:#ffd166;font-size:11px}.upgrade p{margin:7px 0 12px;color:#8197ab;font-size:11px;line-height:1.4}.upgrade-btn{min-height:40px;width:100%;font-size:12px}.upgrade-btn:disabled{opacity:.45;cursor:default}
@media(max-width:520px){.top{height:62px}.planet{left:2%;right:2%}.controls{height:70px;padding:9px}.controls button{font-size:11px}.panel{padding:16px}}
</style>
</head>
<body>
<div id="app"><div class="boot" id="fallbackBoot"><div class="boot-card"><h1 class="boot-logo">PLANET <span>RUSH</span></h1><div class="boot-kicker">MINING NETWORK INITIALISATION</div><div class="boot-status">STARTING GAME SYSTEMS</div><div class="boot-track"><div class="boot-fill" style="width:8%"></div></div><div class="boot-percent">8%</div></div></div></div>
<script>
(function(){
"use strict";
var app=document.getElementById("app");
var state={screen:"game",planet:1,credits:0,mined:0,x:.5,y:.10,target:null,damage:1,speed:1,magnet:1,basePower:1,prestige:0,blocks:[],lastMine:0,vx:0,vy:0,currentWeapon:"lance",overlay:null,booting:true};
var WEAPONS={lance:{name:"Drill Lance",type:"beam",damage:1,cooldown:650,desc:"Focused beam. Reliable and precise."},pulse:{name:"Pulse Cannon",type:"projectile",damage:2,cooldown:950,desc:"Fast energy bolt with heavier impact."},blast:{name:"Blast Charge",type:"blast",damage:1,cooldown:1300,splash:1.7,desc:"Explodes on impact and damages nearby blocks."}};
var BUILD="0.4.1";
var COLS=10,ROWS=20,runTimer=0;
function makeBlocks(){
 var a=[];
 for(var y=1;y<ROWS;y++) for(var x=0;x<COLS;x++){
   if(Math.random()<.075) continue;
   var roll=Math.random();
   a.push({x:x,y:y,special:roll<.055,rare:roll>=.055&&roll<.085,hp:roll<.055?3:roll<.085?2:1});
 }
 return a;
}
function menu(){
 app.innerHTML='<div class="screen menu"><div class="menu-card"><h1 class="logo">PLANET <span>RUSH</span></h1><div class="subtitle">AUTONOMOUS DEEP-SPACE MINING</div><div class="menu-actions"><button class="play" id="play">START RUN</button><button class="menu-btn" id="upgrades">GARAGE & UPGRADES</button><button class="menu-btn" id="base">BASE UPGRADES & PRESTIGE</button><button class="menu-btn" id="continue" disabled>CONTINUE RUN</button></div><div class="version">WEB VERTICAL SLICE • PLANET '+state.planet+'</div></div></div>';
 document.getElementById("play").onclick=startRun;
 document.getElementById("upgrades").onclick=garage;
 document.getElementById("base").onclick=baseUpgrades;
}
function startRun(){state.screen="game";state.overlay=null;state.blocks=makeBlocks();state.x=.5;state.y=.08;state.target=null;state.lastMine=0;state.vx=0;state.vy=0;render();}
function bootOverlay(){return state.booting?'<div class="boot" id="boot"><div class="boot-card"><h1 class="boot-logo">PLANET <span>RUSH</span></h1><div class="boot-kicker">MINING NETWORK INITIALISATION</div><div class="boot-status" id="bootStatus">INITIALISING CORE</div><div class="boot-track"><div class="boot-fill" id="bootFill"></div></div><div class="boot-percent" id="bootPercent">0%</div></div></div>':"";}
function runBootSequence(){var boot=document.getElementById("boot"),fill=document.getElementById("bootFill"),percent=document.getElementById("bootPercent"),status=document.getElementById("bootStatus");if(!boot||!fill||!percent||!status)return;var stages=[{to:20,label:"INITIALISING CORE"},{to:42,label:"BUILDING PLANET"},{to:68,label:"CALIBRATING MINING SYSTEM"},{to:88,label:"LOADING ARMORY"},{to:100,label:"MINING NETWORK READY"}];var i=0,from=0;function stage(){if(i>=stages.length){setTimeout(function(){boot.classList.add("intro");status.textContent="AUTONOMOUS MINER DEPLOYED";percent.style.display="none";setTimeout(function(){boot.classList.add("fade");setTimeout(function(){state.booting=false;boot.remove();render();},450);},1150);},180);return;}var s=stages[i++],start=performance.now(),duration=260;function step(now){var p=Math.min(1,(now-start)/duration),value=Math.round(from+(s.to-from)*p);fill.style.width=value+"%";percent.textContent=value+"%";status.textContent=s.label;if(p<1)requestAnimationFrame(step);else{from=s.to;setTimeout(stage,70);}}requestAnimationFrame(step);}stage();}
function openOverlay(kind){state.screen="game";state.overlay=kind;render();}
function closeOverlay(){state.overlay=null;render();}
function overlayHTML(){
 if(!state.overlay)return "";
 var body="";
 if(state.overlay==="garage") body='<div class="overlay-head"><h2>GARAGE</h2><button class="close" id="closePanel">CLOSE</button></div><div class="panel-sub">Tune the active mining rig while the planet keeps turning.</div><div class="upgrade-list">'+upgradeCard("damage","Drill Power",state.damage,"More damage per attack.","Damage: "+state.damage,10*state.damage)+upgradeCard("speed","Mining Speed",state.speed,"Reduces weapon cooldowns.","Speed: "+state.speed+"×",15*state.speed)+upgradeCard("magnet","Resource Core",state.magnet,"Increases block value.","Value: "+state.magnet+"×",20*state.magnet)+'</div>';
 if(state.overlay==="weapons") body='<div class="overlay-head"><h2>ARMORY</h2><button class="close" id="closePanel">CLOSE</button></div><div class="panel-sub">The miner attacks automatically. Choose the weapon behaviour.</div><div class="weapon-grid">'+Object.keys(WEAPONS).map(function(k){var w=WEAPONS[k];return '<div class="weapon-card '+(state.currentWeapon===k?"active":"")+'"><b>'+w.name+'</b><span>'+w.desc+'<br>Damage '+w.damage+' • Cooldown '+w.cooldown+'ms</span><button data-weapon="'+k+'">'+(state.currentWeapon===k?"EQUIPPED":"EQUIP")+'</button></div>';}).join("")+'</div>';
 if(state.overlay==="stats") body='<div class="overlay-head"><h2>COMMAND</h2><button class="close" id="closePanel">CLOSE</button></div><div class="upgrade-list"><div class="upgrade"><div class="upgrade-head"><div class="upgrade-name">RUN</div><div class="level">PLANET '+state.planet+'</div></div><p>Blocks mined: <b>'+state.mined+'</b><br>Credits: <b>'+Math.floor(state.credits)+'</b><br>Weapon: <b>'+WEAPONS[state.currentWeapon].name+'</b></p></div><div class="upgrade"><div class="upgrade-head"><div class="upgrade-name">PERMANENT</div><div class="level">PRESTIGE '+state.prestige+'</div></div><p>Base power: <b>'+state.basePower+'</b><br>Resource multiplier: <b>'+((1+state.prestige*.01).toFixed(2))+'×</b></p></div><div class="upgrade"><div class="upgrade-head"><div class="upgrade-name">LEADERBOARD</div><div class="level">LOCAL</div></div><p>Highest planet: <b>'+state.planet+'</b><br>Total blocks mined: <b>'+state.mined+'</b></p></div></div>';
 if(state.overlay==="base") body='<div class="overlay-head"><h2>BASE</h2><button class="close" id="closePanel">CLOSE</button></div><div class="panel-sub">Permanent upgrades and prestige. Mining continues underneath.</div><div class="upgrade-list"><div class="upgrade"><div class="upgrade-head"><div class="upgrade-name">Core Power</div><div class="level">LV '+state.basePower+'</div></div><p>Improves baseline mining strength.</p><button class="upgrade-btn" id="basebuy" '+(state.credits<25*state.basePower?"disabled":"")+'>UPGRADE • '+(25*state.basePower)+' CREDITS</button></div><div class="upgrade"><div class="upgrade-head"><div class="upgrade-name">Prestige</div><div class="level">BONUS '+state.prestige+'%</div></div><p>Reset planet progress for permanent base power. Available at Planet 5.</p><button class="upgrade-btn" id="prestige" '+(state.planet<5?"disabled":"")+'>PRESTIGE</button></div></div>';
 return '<div class="overlay"><div class="overlay-card">'+body+'</div></div>';
}
function stats(){
 state.screen="stats";
 app.innerHTML='<div class="screen"><div class="panel"><div class="panel-inner"><button class="back" id="back">← HOME</button><h2>COMMAND LOG</h2><div class="panel-sub">Your mining career and current run performance.</div><div class="upgrade-list"><div class="upgrade"><div class="upgrade-head"><div class="upgrade-name">CURRENT RUN</div><div class="level">PLANET '+state.planet+'</div></div><p>Blocks mined this session: <b>'+state.mined+'</b><br>Credits held: <b>'+Math.floor(state.credits)+'</b><br>Drill power: <b>'+state.damage+'×</b><br>Mining speed: <b>'+state.speed+'×</b></p></div><div class="upgrade"><div class="upgrade-head"><div class="upgrade-name">PERMANENT</div><div class="level">PRESTIGE '+state.prestige+'</div></div><p>Base power: <b>'+state.basePower+'</b><br>Resource multiplier: <b>'+((1+state.prestige*.01).toFixed(2))+'×</b></p></div><div class="upgrade"><div class="upgrade-head"><div class="upgrade-name">LEADERBOARD</div><div class="level">LOCAL</div></div><p>Highest planet reached: <b>'+state.planet+'</b><br>Total mined: <b>'+state.mined+'</b></p></div></div></div></div></div>';
 document.getElementById("back").onclick=function(){state.screen="menu";render()};
}
function baseUpgrades(){
 state.screen="base";
 app.innerHTML='<div class="screen"><div class="panel"><div class="panel-inner"><button class="back" id="back">← HOME</button><h2>BASE</h2><div class="panel-sub">Permanent powers survive every planet. Prestige resets run resources for a permanent multiplier.</div><div class="upgrade-list"><div class="upgrade"><div class="upgrade-head"><div class="upgrade-name">Core Power</div><div class="level">LV '+state.basePower+'</div></div><p>Improves the baseline strength of every future mining ship.</p><button class="upgrade-btn" id="basebuy" '+(state.credits<25*state.basePower?"disabled":"")+'>UPGRADE • '+(25*state.basePower)+' CREDITS</button></div><div class="upgrade"><div class="upgrade-head"><div class="upgrade-name">Prestige</div><div class="level">BONUS '+state.prestige+'%</div></div><p>Reset current credits and planet progress in exchange for permanent base power.</p><button class="upgrade-btn" id="prestige" '+(state.planet<5?"disabled":"")+'>PRESTIGE</button></div></div></div></div></div>';
 document.getElementById("back").onclick=function(){state.screen="menu";render()};
 document.getElementById("basebuy").onclick=function(){var cost=25*state.basePower;if(state.credits>=cost){state.credits-=cost;state.basePower++;baseUpgrades()}};
 document.getElementById("prestige").onclick=function(){if(state.planet>=5){state.prestige++;state.basePower+=2;state.planet=1;state.credits=0;state.blocks=[];baseUpgrades()}};
}
function garage(){openOverlay("garage");return;
 app.innerHTML='<div class="screen"><div class="panel"><div class="panel-inner"><button class="back" id="back">← BACK</button><h2>GARAGE</h2><div class="panel-sub">Spend credits to permanently improve your mining ship.</div><div class="upgrade-list">'+upgradeCard("damage","Drill Power",state.damage,"More damage per mining pass.","Damage: "+state.damage,10*state.damage)+" "+upgradeCard("speed","Mining Speed",state.speed,"Shorter delay between mining passes.","Cycle: "+state.speed+"×",15*state.speed)+" "+upgradeCard("magnet","Resource Core",state.magnet,"Increases the value collected from blocks.","Value: "+state.magnet+"×",20*state.magnet)+'</div></div></div></div>';
 document.getElementById("back").onclick=function(){state.screen="menu";render()};
 ["damage","speed","magnet"].forEach(function(k){var b=document.getElementById("buy-"+k);if(b)b.onclick=function(){var cost=Number(b.dataset.cost);if(state.credits>=cost){state.credits-=cost;state[k]++;garage()}}});
}
function upgradeCard(k,name,level,desc,value,cost){
 return '<div class="upgrade"><div class="upgrade-head"><div class="upgrade-name">'+name+'</div><div class="level">LV '+level+'</div></div><p>'+desc+' '+value+'.</p><button class="upgrade-btn" id="buy-'+k+'" data-cost="'+cost+'" '+(state.credits<cost?"disabled":"")+'>UPGRADE • '+cost+' CREDITS</button></div>';
}
function render(){
 if(state.screen!=="game")state.screen="game";
 app.innerHTML='<div class="screen"><header class="top"><div class="stat"><span>PLANET</span><b>'+state.planet+'</b></div><div class="stat"><span>CREDITS</span><b class="gold">'+state.credits.toLocaleString()+'</b></div><div class="stat"><span>MINED</span><b>'+state.mined+'</b></div><div class="stat"><span>DRILL</span><b>'+state.damage+'×</b></div></header><main class="field" id="field"><div class="stars"></div><div id="toast" style="position:absolute;z-index:20;left:50%;top:54%;transform:translate(-50%,-50%) scale(.9);padding:12px 18px;border:1px solid #5bd8ff;border-radius:10px;background:#071522ee;color:#eafaff;font-size:12px;font-weight:900;letter-spacing:.12em;opacity:0;pointer-events:none;transition:.18s;white-space:nowrap"></div><div class="planet"><div class="blocks" id="blocks">'+state.blocks.map(function(b,i){return '<div class="block '+(b.special?"special ": "")+(b.rare?"rare ":"")+'" data-i="'+i+'" style="left:'+(b.x/COLS*100)+'%;top:'+(b.y/ROWS*100)+'%;width:'+(100/COLS-.8)+'%;height:'+(100/ROWS-.8)+'%"></div>';}).join("")+'</div></div><div class="beam" id="beam"></div><div class="ship" id="ship"><div class="ship-body"></div><div class="ship-core"></div><div class="ship-fin left"></div><div class="ship-fin right"></div></div><div class="message">AUTONOMOUS • '+WEAPONS[state.currentWeapon].name.toUpperCase()</div><div class="hud"><div class="pill">POWER '+state.damage+'×</div><div class="pill">SPEED '+state.speed+'×</div></div><div class="build-overlay">BUILD '+BUILD+' • SOURCE 91196ed</div></main><footer class="controls"><button id="garage" class="primary">GARAGE</button><button id="weapons">ARMORY</button><button id="stats">STATS</button><button id="base">BASE</button></footer>'+overlayHTML()+bootOverlay()+'</div>';
 var field=document.getElementById("field"),ship=document.getElementById("ship"),beam=document.getElementById("beam");
 function place(){ship.style.left=(state.x*100)+"%";ship.style.top=(8+state.y*88)+"%";}
 place();
 document.getElementById("garage").onclick=garage;
 document.getElementById("weapons").onclick=function(){openOverlay("weapons")};
 document.getElementById("stats").onclick=function(){openOverlay("stats")};
 document.getElementById("base").onclick=function(){openOverlay("base")};
 if(state.overlay){
   document.getElementById("closePanel").onclick=closeOverlay;
   ["damage","speed","magnet"].forEach(function(k){var buy=document.getElementById("buy-"+k);if(buy)buy.onclick=function(){var cost=Number(buy.dataset.cost);if(state.credits>=cost){state.credits-=cost;state[k]++;render();}}});
   document.querySelectorAll("[data-weapon]").forEach(function(b){b.onclick=function(){state.currentWeapon=b.dataset.weapon;render();}});
   var bb=document.getElementById("basebuy");if(bb)bb.onclick=function(){var cost=25*state.basePower;if(state.credits>=cost){state.credits-=cost;state.basePower++;render();}};
   var pp=document.getElementById("prestige");if(pp)pp.onclick=function(){if(state.planet>=5){state.prestige++;state.basePower+=2;state.planet=1;state.credits=0;state.blocks=makeBlocks();render();}};
 }
}
function mine(){
 if(state.screen!=="game"||!state.blocks.length)return;
 var weapon=WEAPONS[state.currentWeapon],best=-1,score=Infinity;
 for(var i=0;i<state.blocks.length;i++){
   var b=state.blocks[i],bx=(b.x+.5)/COLS,by=(b.y+.5)/ROWS;
   var s=Math.abs(bx-state.x)+Math.abs(by-state.y)*.55;
   if(s<score){score=s;best=i;}
 }
 if(best<0)return;
 var b=state.blocks[best],field=document.getElementById("field"),target=document.querySelector('.block[data-i="'+best+'"]');
 state.target=best;
 var ship=document.getElementById("ship");
 if(ship&&field&&target){
   var fr=field.getBoundingClientRect(),sr=ship.getBoundingClientRect(),tr=target.getBoundingClientRect();
   var sx=sr.left+sr.width/2-fr.left,sy=sr.top+sr.height/2-fr.top,tx=tr.left+tr.width/2-fr.left,ty=tr.top+tr.height/2-fr.top;
   if(weapon.type==="beam"){
     var beam=document.getElementById("beam");if(beam){var dx=tx-sx,dy=ty-sy;beam.style.left=sx+"px";beam.style.top=sy+"px";beam.style.height=Math.hypot(dx,dy)+"px";beam.style.transform="rotate("+Math.atan2(dy,dx)+"rad)";beam.classList.add("active");setTimeout(function(){beam.classList.remove("active")},180);}
   } else if(weapon.type==="projectile"){
     var p=document.createElement("div");p.className="projectile";p.style.left=(sx-5)+"px";p.style.top=(sy-5)+"px";field.appendChild(p);
     requestAnimationFrame(function(){p.style.transition="left .28s linear,top .28s linear";p.style.left=(tx-5)+"px";p.style.top=(ty-5)+"px";});
     setTimeout(function(){if(p.parentNode)p.remove();},330);
   } else {
     var ring=document.createElement("div");ring.className="blast-ring";ring.style.left=(tx-14)+"px";ring.style.top=(ty-14)+"px";field.appendChild(ring);setTimeout(function(){if(ring.parentNode)ring.remove();},450);
   }
   var burst=document.createElement("div");burst.className="burst";burst.style.left=(tx-17)+"px";burst.style.top=(ty-17)+"px";field.appendChild(burst);setTimeout(function(){if(burst.parentNode)burst.remove()},320);
 }
 var power=state.damage+state.basePower-1+weapon.damage-1;
 b.hp-=power;
 if(weapon.type==="blast"){
   for(var j=0;j<state.blocks.length;j++){
     if(j===best)continue;
     var n=state.blocks[j],dist=Math.hypot(n.x-b.x,n.y-b.y);
     if(dist<=weapon.splash){n.hp-=Math.max(1,state.damage+state.basePower-2);var el=document.querySelector('.block[data-i="'+j+'"]');if(el)el.classList.add("blast-hit");}
   }
 }
 if(target){target.classList.add("hit");setTimeout(function(){if(target)target.classList.remove("hit")},180);}
 if(b.hp<=0){
   var gain=(b.special?25:b.rare?12:5)*state.magnet*(1+state.prestige*.01);
   state.credits+=gain;state.mined++;
   state.blocks.splice(best,1);
   if(target&&target.parentNode)target.remove();
   var toast=document.getElementById("toast");if(toast){toast.textContent="+"+Math.floor(gain)+" CREDITS";toast.style.opacity="1";toast.style.transform="translate(-50%,-50%) scale(1)";setTimeout(function(){toast.style.opacity="0";toast.style.transform="translate(-50%,-50%) scale(.9)"},420);}
   updateHUD();
   if(state.blocks.length===0)setTimeout(nextPlanet,500);
 }
}
function updateHUD(){
 var stats=document.querySelectorAll(".top .stat b");if(stats.length>=4){stats[0].textContent=state.planet;stats[1].textContent=Math.floor(state.credits).toLocaleString();stats[2].textContent=state.mined;stats[3].textContent=state.damage+"×";}
 var pills=document.querySelectorAll(".hud .pill");if(pills.length>=2){pills[0].textContent="POWER "+state.damage+"×";pills[1].textContent="SPEED "+state.speed+"×";}
}
function nextPlanet(){
 if(state.screen!=="game")return;
 state.planet++;state.blocks=makeBlocks();state.x=.5;state.y=.08;state.target=null;render();
}
try{startRun();setTimeout(runBootSequence,40);}catch(err){var fb=document.getElementById("fallbackBoot");if(fb){var msg=String(err&&err.message||err).replace(/[<>&"]/g,"");fb.innerHTML='<div class="boot-card"><h1 class="boot-logo">PLANET <span>RUSH</span></h1><div class="boot-kicker">STARTUP ERROR</div><div class="boot-status">RECOVERY REQUIRED • '+msg+'</div><div class="boot-track"><div class="boot-fill" style="width:100%"></div></div><div class="boot-percent">ERROR</div></div>';}}
setInterval(function(){
 if(state.screen==="game"){
   var target=state.blocks[state.target];
   if(target){
     var tx=(target.x+.5)/COLS,ty=(target.y+.5)/ROWS;
     state.vx+=(tx-state.x)*.055;state.vy+=(ty-state.y)*.055;
   }
   state.vx*=.88;state.vy*=.88;
   state.x=Math.max(.12,Math.min(.88,state.x+state.vx));state.y=Math.max(.04,Math.min(.90,state.y+state.vy));
   var liveShip=document.getElementById("ship");if(liveShip){liveShip.style.left=(state.x*100)+"%";liveShip.style.top=(8+state.y*88)+"%";}
 }
 if(state.screen==="game"&&!state.booting&&Date.now()-state.lastMine>Math.max(220,WEAPONS[state.currentWeapon].cooldown/state.speed)){
   state.lastMine=Date.now();mine();
 }
},100);
})();
</script>
</body>
</html>
